<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El impostor de la Navidad de Inlight </title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#0f2a24;--panel:#173a32;--line:#2c5a4e;--ink:#f3ecdc;--mute:#a9c2b6;--candle:#f2c14e;--berry:#d8434f;--leaf:#6fbf8b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 17px/1.5 Figtree,system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 18px 40px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:800;line-height:1.05;margin:0 0 .4em}
h1{font-size:2.4rem}h2{font-size:1.7rem}
p{margin:0 0 1em;color:var(--mute)}
label{display:block;font-weight:600;margin:18px 0 6px}
input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
input:focus,button:focus-visible,select:focus{outline:3px solid var(--candle);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--candle);border-color:var(--candle);color:#2a2008;font-weight:600}
.btn{display:block;width:100%;margin-top:22px;padding:16px;border:0;border-radius:12px;background:var(--berry);color:#fff;font:600 1.1rem Figtree,sans-serif;cursor:pointer}
.btn.alt{background:transparent;border:1.5px solid var(--line);color:var(--ink);margin-top:10px}
.names{display:grid;gap:8px}
.card{margin-top:18px;min-height:240px;border-radius:18px;background:var(--panel);border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.card.open{border-style:solid;border-color:var(--candle)}
.card.imp{border-color:var(--berry)}
.big{font:800 2.4rem/1.1 Fraunces,Georgia,serif;margin:0}
.small{color:var(--mute);margin:.6em 0 0}
.who{font:800 1.5rem Fraunces,Georgia,serif;color:var(--candle)}
ul.pl{list-style:none;padding:0;margin:12px 0;display:flex;flex-wrap:wrap;gap:8px}
ul.pl li{padding:8px 14px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}
.err{color:#ffb4b4;min-height:1.4em;margin-top:10px}
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.5;animation:f linear infinite}
@keyframes f{to{transform:translateY(105vh)}}
@media (prefers-reduced-motion:reduce){.snow{display:none}}
</style>
</head>
<body>
<div class="snow" id="snow" aria-hidden="true"></div>
<main id="app"></main>
<script>
const BANCO={
"Comida y bebida":["tamal","rompope","pavo relleno","churchill","ensalada de manzana","queque seco","buñuelos","turrón","ponche","chocolate caliente","galletas de jengibre","queque navideño","sangría","cajeta","arroz con pollo"],
"Tradiciones":["posada","tope","cimarrona","aguinaldo","amigo secreto","fuegos artificiales","Festival de la Luz","Fiestas de Zapote","lotería","pólvora","cena de Navidad"],
"Personajes":["Santa Claus","Grinch","Rodolfo el reno","Niño Dios","Reyes Magos","elfo","muñeco de nieve","Mamá Noel","ángel","Keylor Navas","Scrooge","Cascanueces","José y María","Dora la exploradora","Rolo"],
"Películas y villancicos":["Mi pobre angelito","Elf","El expreso polar","Love Actually","Qué bello es vivir","Noche de paz","Campana sobre campana","Jingle Bells","Blanca Navidad","Los peces en el río","Burrito sabanero","Feliz Navidad","Rodolfo el reno","Navidad","El Cascanueces"],
"Adornos y regalos":["árbol de Navidad","esfera","guirnalda","luces","estrella","calcetín","nacimiento","papel de regalo","bastón de caramelo","muérdago","pino","tarjeta navideña","gorro de Santa"],
"Lugares y clima":["Polo Norte","trineo","chimenea","nieve","taller de Santa","Belén","establo","mercado navideño","pista de patinaje","centro comercial","chimenea encendida","cabaña","vientos de diciembre","Avenida Central","casa de los abuelos"]
};
const app=document.getElementById('app');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
let S={names:['','',''],cats:Object.keys(BANCO),imps:1,mix:false,err:''};
try{const o=JSON.parse(localStorage.getItem('imp')||'null');if(o&&o.names)S.names=o.names}catch(e){}
let G=null;

function snow(){const s=document.getElementById('snow');for(let i=0;i<30;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.animationDuration=(8+Math.random()*10)+'s';e.style.animationDelay=(-Math.random()*14)+'s';s.appendChild(e)}}
snow();

function setup(){
  app.innerHTML=`<h1>El impostor de la Navidad</h1>
  <p>Pasen el celular. Todos ven la misma palabra navideña, menos el impostor. Den pistas, voten y descúbranlo.</p>
  <label>Jugadores</label><div class="names" id="names"></div>
  <div class="row" style="margin-top:8px"><button class="chip" id="add">Agregar jugador</button><button class="chip" id="rem">Quitar último</button></div>
  <label>Categorías</label><div class="row" id="cats"></div>
  <label>Impostores</label><div class="row" id="imps"></div>
  <div class="err" role="alert" id="err">${esc(S.err)}</div>
  <button class="btn" id="go">Empezar partida</button>`;
  const n=document.getElementById('names');
  S.names.forEach((v,i)=>{const inp=document.createElement('input');inp.type='text';inp.maxLength=16;inp.placeholder='Jugador '+(i+1);inp.value=v;inp.setAttribute('aria-label','Nombre del jugador '+(i+1));inp.oninput=()=>S.names[i]=inp.value;n.appendChild(inp)});
  document.getElementById('add').onclick=()=>{if(S.names.length<12){S.names.push('');setup()}};
  document.getElementById('rem').onclick=()=>{if(S.names.length>3){S.names.pop();setup()}};
  const c=document.getElementById('cats');
  const mb=document.createElement('button');mb.className='chip';mb.textContent='Mezcla de todas';mb.setAttribute('aria-pressed',S.mix);mb.onclick=()=>{S.mix=!S.mix;setup()};c.appendChild(mb);
  if(!S.mix)Object.keys(BANCO).forEach(k=>{const b=document.createElement('button');b.className='chip';b.textContent=k;b.setAttribute('aria-pressed',S.cats.includes(k));b.onclick=()=>{S.cats=S.cats.includes(k)?S.cats.filter(x=>x!==k):[...S.cats,k];setup()};c.appendChild(b)});
  const im=document.getElementById('imps');
  [1,2].forEach(k=>{const b=document.createElement('button');b.className='chip';b.textContent=k;b.setAttribute('aria-pressed',S.imps===k);b.onclick=()=>{S.imps=k;setup()};im.appendChild(b)});
  document.getElementById('go').onclick=start;
  }

function start(){
  const names=S.names.map(x=>x.trim()).map((x,i)=>x||'Jugador '+(i+1));
  if(!S.mix&&!S.cats.length){S.err='Elige al menos una categoría.';return setup()}
  if(S.imps>=names.length-1){S.err='Hay demasiados impostores para tan pocos jugadores.';return setup()}
  S.err='';try{localStorage.setItem('imp',JSON.stringify({names:S.names}))}catch(e){}
  newRound(names);
  }
function newRound(names){
  let cat,word;
  if(S.mix){
    const pares=Object.entries(BANCO).flatMap(([k,v])=>v.map(w=>[k,w]));
    [cat,word]=pick(pares);
  }else{
    cat=pick(S.cats);word=pick(BANCO[cat]);
  }
  const idx=names.map((_,i)=>i).sort(()=>Math.random()-.5);
  const imps=idx.slice(0,S.imps);
  const inocentes=names.filter((_,i)=>!imps.includes(i));
  G={names,cat,word,imps,turn:0,shown:false,first:pick(inocentes)};
  reveal();
  }
function reveal(){
  const i=G.turn,isImp=G.imps.includes(i);
  app.innerHTML=`<p>Jugador ${i+1} de ${G.names.length}</p><h2>Pásale el celular a</h2><div class="who">${esc(G.names[i])}</div>
  <div class="card ${G.shown?'open':''} ${G.shown&&isImp?'imp':''}" id="card">${
    G.shown?(isImp?`<p class="big" style="color:var(--berry)">Eres el impostor</p><p class="small">Categoría: ${esc(G.cat)}</p><p class="small">Disimula y adivina la palabra.</p>`
    :`<p class="small">La palabra es</p><p class="big">${esc(G.word)}</p><p class="small">Categoría: ${esc(G.cat)}</p>`)
    :`<p class="small">Solo ${esc(G.names[i])} debe mirar la pantalla.</p>`}</div>
  <button class="btn" id="b">${G.shown?'Ocultar y pasar':'Ver mi palabra'}</button>`;
  document.getElementById('b').onclick=()=>{
    if(!G.shown){G.shown=true;reveal()}
    else{G.shown=false;G.turn++;G.turn>=G.names.length?play():reveal()}};
  }
function play(){
  app.innerHTML=`<h2>¡A jugar!</h2><p>Empieza <strong style="color:var(--candle)">${esc(G.first)}</strong>. Cada quien da una pista de una palabra sobre la palabra secreta, sin decirla. Después discutan y voten.</p>
  <ul class="pl">${G.names.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
  <p>Categoría: ${esc(G.cat)}</p>
  <button class="btn" id="r">Revelar al impostor</button>`;
  document.getElementById('r').onclick=result;
  }
function result(){
  const im=G.imps.map(i=>G.names[i]);
  app.innerHTML=`<h2>${im.length>1?'Los impostores eran':'El impostor era'}</h2>
  <div class="card open imp"><p class="big" style="color:var(--berry)">${im.map(esc).join(' y ')}</p>
  <p class="small">La palabra era</p><p class="big">${esc(G.word)}</p></div>
  <p style="margin-top:14px">Si lo descubrieron gana el grupo. Si el impostor adivina la palabra, gana él.</p>
  <button class="btn" id="a">Otra ronda</button><button class="btn alt" id="c">Cambiar jugadores</button>`;
  document.getElementById('a').onclick=()=>newRound(G.names);
  document.getElementById('c').onclick=setup;
  }
setup();
</script>
</body>
</html>
